name: Security Scan

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    - cron: '0 2 * * *'  # daily at 2 AM UTC
  workflow_dispatch: # allow manual trigger

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      matrix:
        project: [ "haroii-backend", "haroii-frontend", "customer-side-frontend" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.project }}

      - name: Run ESLint security checks
        run: npm run lint
        continue-on-error: true
        working-directory: ${{ matrix.project }}

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
        working-directory: ${{ matrix.project }}

      - name: Run Snyk Code Analysis
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test
          args: --severity-threshold=medium --sarif-file-output=snyk-${{ matrix.project }}.sarif
          cwd: ${{ matrix.project }}

      - name: Run Snyk Dependency Scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --severity-threshold=high --all-projects
          cwd: ${{ matrix.project }}

      - name: Upload Snyk SARIF
        if: always()
        run: |
          SARIF_FILE="snyk-${{ matrix.project }}.sarif"
          ARTIFACT_DIR="artifacts"
          mkdir -p $ARTIFACT_DIR
          if [[ -f $SARIF_FILE ]]; then
            echo "Checking Advanced Security..."
            AS_ENABLED=$(gh api graphql -f query='query { repository(owner:"'"${GITHUB_REPOSITORY_OWNER}"'", name:"'"${GITHUB_REPOSITORY_NAME}"'") { advancedSecurityEnabled } }' | grep true || echo false)
            if [[ "$AS_ENABLED" == "true" ]]; then
              echo "Advanced Security enabled. Uploading SARIF..."
              gh run upload-sarif --file $SARIF_FILE
            else
              echo "Advanced Security not enabled. Saving SARIF as artifact..."
              mv $SARIF_FILE $ARTIFACT_DIR/
            fi
          fi

      - name: Save SARIF artifact
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: snyk-sarif-${{ matrix.project }}
          path: artifacts/snyk-${{ matrix.project }}.sarif
